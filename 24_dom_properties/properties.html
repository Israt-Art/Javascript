<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Properties Practice</title>
    <link rel="stylesheet" href="properties.css">
</head>
<body>

    <div class="container">
        <h1 id="title">DOM Properties</h1>

        <p id="para">
            Hello <span style="display:none;">Hidden Text</span>
            World
        </p>

        <div id="box">
            <b>This is bold text</b>
        </div>

        <button onclick="showProperties()">
            Show Properties
        </button>

        <div class="output">
            <h2>Output:</h2>
            <p id="result"></p>
        </div>
    </div>

    <script src="properties.js"></script>
</body>
</html>
