<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="event.css"/>
</head>

<body>
    
    <!-- onclick -> each time click record -->
    <button onclick="console.log('button was clicked'); alert('hello!')">
        click me!
    </button> 

    <!-- ondblclick -> works after double click -->
    <button ondblclick="console.log('button was clicked 2X')">
        click me 2 times!
    </button>

    <div>
        this is a box
    </div>

    <!-- onmouseover -> its hover jotobar israt click kora hbe totobar count-->

    <div onmouseover="console.log('you are inside the div')">israt</div>//

    <script src="event.js"></script>
</body>
</html>
